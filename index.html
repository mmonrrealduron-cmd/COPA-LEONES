<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3ERA COPA LEONES</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(rgba(0,0,0,.80),rgba(0,0,0,.88)),
    url('fondo.png');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;

    overflow-x:hidden;

}

/* EFECTO ANIMADO */

body::before{

    content:'';

    position:fixed;

    inset:0;

    background:
    radial-gradient(circle at 20% 20%,rgba(255,215,0,.08),transparent 20%),
    radial-gradient(circle at 80% 40%,rgba(255,255,255,.05),transparent 20%),
    radial-gradient(circle at 50% 90%,rgba(255,215,0,.06),transparent 20%);

    animation:moveParticles 10s infinite alternate ease-in-out;

}

@keyframes moveParticles{

    from{
        transform:translateY(-20px);
    }

    to{
        transform:translateY(20px);
    }

}

/* CONTENEDOR */

.container{

    position:relative;
    z-index:2;

    width:100%;
    max-width:850px;

    background:rgba(0,0,0,.45);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    border-radius:30px;

    padding:40px;

    box-shadow:
    0 0 30px rgba(0,0,0,.5),
    0 0 70px rgba(255,215,0,.08);

    animation:fadeUp 1s ease;

}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(50px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* LOGO */

.logo-area{

    text-align:center;
    margin-bottom:30px;

}

.logo-area img{

    width:90px;
    height:auto;

    margin-bottom:15px;

    filter:drop-shadow(0 0 20px rgba(255,255,255,.2));

    animation:pulse 3s infinite;

}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.06);
    }

    100%{
        transform:scale(1);
    }

}

/* TITULOS */

.logo-area h1{

    color:white;

    font-size:3rem;

    font-weight:900;

    letter-spacing:3px;

    margin-bottom:10px;

    text-shadow:
    0 0 15px rgba(255,255,255,.3),
    0 0 30px rgba(255,215,0,.25);

}

.logo-area p{

    color:#ddd;
    font-size:1rem;

}

/* FORM */

form{

    display:flex;
    flex-direction:column;
    gap:22px;

}

.input-group{

    display:flex;
    flex-direction:column;

}

.input-group label{

    color:white;

    margin-bottom:10px;

    font-weight:600;

}

input,
select,
textarea{

    background:#121212;

    border:1px solid rgba(255,255,255,.08);

    color:white;

    padding:16px;

    border-radius:16px;

    font-size:1rem;

    transition:.3s;

}

input:focus,
select:focus,
textarea:focus{

    outline:none;

    border:1px solid gold;

    box-shadow:
    0 0 15px rgba(255,215,0,.25);

}

textarea{

    resize:none;
    min-height:100px;

}

/* MODALIDADES */

.modalidades-title{

    color:white;

    font-size:1.1rem;

    font-weight:700;

    margin-bottom:15px;

}

.checkbox-grid{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:15px;

}

.check-card{

    background:#121212;

    border:1px solid rgba(255,255,255,.05);

    border-radius:18px;

    padding:18px;

    display:flex;
    align-items:center;
    gap:12px;

    cursor:pointer;

    transition:.3s;

}

.check-card:hover{

    transform:translateY(-4px);

    border:1px solid gold;

    box-shadow:
    0 0 20px rgba(255,215,0,.15);

}

.check-card input{

    transform:scale(1.3);

}

.check-card span{

    color:white;

    font-weight:500;

}

/* BOTON */

.btn{

    border:none;

    padding:20px;

    border-radius:18px;

    background:
    linear-gradient(45deg,#d4af37,#ffdf70);

    color:black;

    font-size:1rem;

    font-weight:900;

    cursor:pointer;

    transition:.3s;

    margin-top:10px;

}

.btn:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 20px rgba(255,215,0,.35),
    0 0 50px rgba(255,215,0,.15);

}

/* MENSAJE */

#mensaje{

    margin-top:20px;

    text-align:center;

    color:#00ff99;

    font-weight:700;

}

/* MOBILE */

@media(max-width:768px){

    .container{
        padding:25px;
    }

    .logo-area h1{
        font-size:2rem;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="logo-area">

        <img src="logo.png" alt="Logo">

        <h1>3ERA COPA LEONES</h1>

        <p>
            Registro Oficial del Torneo de Taekwondo
        </p>

    </div>

    <form id="registroForm">

        <div class="input-group">

            <label>Nombre del Atleta</label>

            <input type="text" name="atleta" required>

        </div>

        <div class="input-group">

            <label>Nombre del Dojang</label>

            <input type="text" name="dojang" required>

        </div>

        <div class="input-group">

            <label>Nombre del Entrenador</label>

            <input type="text" name="entrenador" required>

        </div>

        <div class="input-group">

            <label>Edad</label>

            <input type="number" name="edad" required>

        </div>

        <div class="input-group">

            <label>Grado / Cinta</label>

            <select name="cinta">

                <option>Selecciona una cinta</option>

                <option>⬜ Blanca</option>
                <option>🟨 Amarilla</option>
                <option>🟩 Verde</option>
                <option>🟦 Azul</option>
                <option>🟥 Roja</option>
                <option>⬛ Negra</option>

            </select>

        </div>

        <div>

            <div class="modalidades-title">
                Modalidades
            </div>

            <div class="checkbox-grid">

                <label class="check-card">

                    <input type="checkbox" value="Combate">

                    <span>🥋 Combate</span>

                </label>

                <label class="check-card">

                    <input type="checkbox" value="Formas">

                    <span>🔥 Formas</span>

                               <label><input type="checkbox" value="Campamento"> Campamento</label>

                    <label><input type="checkbox" value="Sin contacto a la cabeza"> Sin contacto a la cabeza</label>
                </div>
            </div>

            </div>

        </div>

        <div class="input-group">

            <label>Varias Modalidades</label>

            <textarea
            name="extra"
            placeholder="Escribe otras modalidades..."></textarea>

        </div>

        <div class="input-group">

            <label>WhatsApp</label>

            <input
            type="text"
            name="whatsapp"
            placeholder="Ejemplo: 8711234567"
            required>

        </div>

        <button class="btn" type="submit">

            REGISTRAR ATLETA

        </button>

    </form>

    <div id="mensaje"></div>

</div>

<script>

const form =
document.getElementById('registroForm');

const mensaje =
document.getElementById('mensaje');

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbxraN7l6TSPQElC2QyVnuXRFagNXyR_Zm1j3hL0xYDc04FIzgakl5rCE5FNVslG0Xzp8Q/exec';

form.addEventListener('submit',async(e)=>{

    e.preventDefault();

    const modalidades=[];

    document
    .querySelectorAll('.check-card input:checked')
    .forEach(check=>{

        modalidades.push(check.value);

    });

    const datos={

        atleta:form.atleta.value,

        dojang:form.dojang.value,

        entrenador:form.entrenador.value,

        edad:form.edad.value,

        cinta:form.cinta.value,

        modalidades:modalidades.join(', '),

        extra:form.extra.value,

        whatsapp:form.whatsapp.value

    };

    try{

        await fetch(SCRIPT_URL,{

            method:'POST',

            body:JSON.stringify(datos)

        });

        mensaje.innerHTML=
        '✅ Registro enviado correctamente';

        form.reset();

    }catch(error){

        mensaje.innerHTML=
        '❌ Error al registrar';

    }

});

</script>

</body>
</html>
